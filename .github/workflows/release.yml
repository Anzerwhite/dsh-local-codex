name: Release

# Publishes dsh-local-codex to npm and attaches the packed tarball to a GitHub
# Release. Create a GitHub repository, push this repo, then either:
#   - add a repository secret NPM_TOKEN (npm automation token) to also publish
#     to npm, or
#   - skip npm: the workflow still builds the tarball and attaches it to the
#     Release, which is enough for the DSH plugin market.
# Trigger with a tag: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Job-level env lets the npm step be skipped when the secret is absent:
      # GitHub does not allow secrets directly in `if:` conditions.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Guard repository metadata
        run: |
          if grep -q 'PLACEHOLDER' package.json publish/*.yml README.md 2>/dev/null; then
            echo "::error::Run publish/set-repo.sh <owner> <repo> before tagging a release."
            exit 1
          fi

      - name: Pack
        run: npm pack

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: npm publish skipped (no NPM_TOKEN secret)
        if: env.NPM_TOKEN == ''
        run: |
          echo "NPM_TOKEN secret is not configured; skipping npm publish."
          echo "The GitHub Release tarball is still attached and installable from the market."

      - name: Attach tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-local-codex-*.tgz
          generate_release_notes: true
